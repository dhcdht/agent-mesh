<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Mesh 控制台 (STABLE)</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; height: 100vh; overflow: hidden;
      background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      height: 60px; border-bottom: 1px solid #334155; background: #1e293b;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0;
    }
    main { display: flex; flex: 1; overflow: hidden; }
    
    aside {
      width: 280px; border-right: 1px solid #334155; background: #111827;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .aside-section { flex: 1; overflow-y: auto; padding: 15px; border-bottom: 1px solid #334155; }
    .aside-title { font-size: 12px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
    
    #chatArea {
      flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; min-width: 0;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 140px;
    }
    
    #inputContainer {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
      background: rgba(15, 23, 42, 0.95); border-top: 1px solid #334155;
    }
    .input-wrapper {
      max-width: 900px; margin: 0 auto; background: #1e293b; border: 2px solid #3b82f6; 
      border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 10px;
    }
    textarea {
      flex: 1; background: transparent; border: none; color: white; outline: none;
      resize: none; font-family: inherit; font-size: 14px; height: 32px;
    }
    button#sendBtn {
      background: #3b82f6; color: white; border: none; padding: 8px 20px; 
      border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    button#sendBtn:disabled { opacity: 0.5; }
    
    .msg { max-width: 90%; display: flex; flex-direction: column; }
    .msg.user { align-self: flex-end; text-align: right; }
    .msg.agent { align-self: flex-start; }
    .msg-header { font-size: 10px; color: #64748b; margin-bottom: 4px; }
    .msg-body { 
      padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; 
      white-space: pre-wrap; word-break: break-word; text-align: left;
    }
    .user .msg-body { background: #3b82f6; color: white; }
    .agent .msg-body { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .online { background: #22c55e; }
    .offline { background: #ef4444; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 15px;">
      <h1 style="margin: 0; font-size: 18px; color: #3b82f6;">Agent Mesh Stable</h1>
      <select id="meshSelect" style="background: #0f172a; color: white; border: 1px solid #334155; padding: 4px 8px; border-radius: 4px;"></select>
    </div>
    <div style="font-size: 12px; color: #64748b;">
      <span id="sseDot" class="dot offline"></span> <span id="sseLabel">OFFLINE</span>
    </div>
  </header>

  <main>
    <aside>
      <div class="aside-section">
        <div class="aside-title">Agents Online (<span id="agentCount">0</span>)</div>
        <div id="agentsList"></div>
      </div>
      <div class="aside-section">
        <div class="aside-title">Active Tasks (<span id="taskCount">0</span>)</div>
        <div id="tasksList"></div>
      </div>
    </aside>

    <section id="chatArea">
      <div id="messages"></div>
      <div id="inputContainer">
        <div class="input-wrapper">
          <textarea id="messageInput" placeholder="Send a message to the mesh..."></textarea>
          <button id="sendBtn" disabled>SEND</button>
        </div>
        <div id="errorMsg" style="color: #ef4444; font-size: 10px; text-align: center; margin-top: 5px;"></div>
      </div>
    </section>
  </main>

  <script>
    const API = '/api/v1';
    const state = { meshId: '', sse: null, seen: new Set() };
    const els = {
      meshSelect: document.getElementById('meshSelect'),
      agentsList: document.getElementById('agentsList'),
      tasksList: document.getElementById('tasksList'),
      agentCount: document.getElementById('agentCount'),
      taskCount: document.getElementById('taskCount'),
      messages: document.getElementById('messages'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      errorMsg: document.getElementById('errorMsg'),
      sseDot: document.getElementById('sseDot'),
      sseLabel: document.getElementById('sseLabel')
    };

    function genId() { return Math.random().toString(36).slice(2) + Date.now(); }

    async function apiReq(path, method = 'GET', body = null) {
      const r = await fetch(API + path, {
        method, headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
      if (!r.ok) throw new Error(await r.text() || r.statusText);
      return r.json();
    }

    function renderMsg(m) {
      if (state.seen.has(m.id)) return;
      state.seen.add(m.id);
      const isUser = m.from === 'user' || m.from === 'lead';
      const div = document.createElement('div');
      div.className = `msg ${isUser ? 'user' : 'agent'}`;
      div.innerHTML = `
        <div class="msg-header">${m.from.toUpperCase()} @ ${new Date(m.timestamp || Date.now()).toLocaleTimeString()}</div>
        <div class="msg-body">${typeof m.payload === 'string' ? m.payload : (m.payload.text || JSON.stringify(m.payload))}</div>
      `;
      els.messages.appendChild(div);
      els.messages.scrollTo({ top: els.messages.scrollHeight, behavior: 'smooth' });
    }

    async function load() {
      if (!state.meshId) return;
      try {
        const [a, t, h] = await Promise.all([
          apiReq(`/agents?meshId=${state.meshId}`),
          apiReq(`/tasks?meshId=${state.meshId}`),
          apiReq(`/meshes/${state.meshId}/channel`)
        ]);
        els.agentCount.textContent = a.items.length;
        els.agentsList.innerHTML = a.items.map(i => `<div style="padding:5px 0"><span class="dot ${i.nodeOnline ? 'online' : 'offline'}"></span>${i.id}</div>`).join('');
        els.taskCount.textContent = t.items.filter(x => x.status === 'in_progress').length;
        els.tasksList.innerHTML = t.items.map(i => `<div style="padding:5px 0; border-bottom:1px solid #1e293b"><b>${i.id}</b>: ${i.status}</div>`).join('');
        els.messages.innerHTML = '';
        state.seen.clear();
        h.items.sort((x, y) => new Date(x.timestamp) - new Date(y.timestamp)).forEach(renderMsg);
        els.sendBtn.disabled = false;
        connect();
      } catch (e) { els.errorMsg.textContent = e.message; }
    }

    function connect() {
      if (state.sse) state.sse.close();
      state.sse = new EventSource(`${API}/events?meshId=${state.meshId}`);
      state.sse.onopen = () => { 
        els.sseDot.className = 'dot online'; 
        els.sseLabel.textContent = 'ONLINE'; 
        refreshStatus();
      };
      state.sse.onerror = () => { els.sseDot.className = 'dot offline'; els.sseLabel.textContent = 'RECONNECTING...'; };
      state.sse.addEventListener('message', (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'message.created') renderMsg(ev.message);
        else if (ev.type === 'node.heartbeat' || ev.type.startsWith('agent.')) refreshStatus();
        else load();
      });
    }

    async function send() {
      const text = els.messageInput.value.trim();
      if (!text) return;
      const payload = { id: genId(), meshId: state.meshId, from: 'user', to: '*', type: 'message', payload: { text } };
      try {
        els.messageInput.value = '';
        renderMsg({ ...payload, timestamp: new Date().toISOString() });
        await apiReq('/messages', 'POST', payload);
      } catch (e) { els.errorMsg.textContent = 'Send failed: ' + e.message; }
    }

    els.meshSelect.onchange = (e) => { state.meshId = e.target.value; load(); };
    els.sendBtn.onclick = send;
    els.messageInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

    apiReq('/meshes').then(r => {
      els.meshSelect.innerHTML = r.items.map(m => `<option value="${m.id}">${m.id}</option>`).join('');
      if (r.items.length > 0) { state.meshId = r.items[0].id; load(); }
    });
  </script>
</body>
</html>
