<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Mesh | Mission Control</title>
  <style>
    :root {
      --bg: #050505;
      --surface: #111;
      --accent: #3b82f6;
      --border: #222;
      --text: #e2e8f0;
      --text-dim: #64748b;
    }
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; height: 100vh; overflow: hidden;
      background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
      display: grid; grid-template-rows: 50px 1fr;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    main {
      display: grid; grid-template-columns: 260px 1fr 350px; overflow: hidden;
    }
    aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .panel-title { 
      padding: 15px; font-size: 11px; font-weight: bold; color: var(--text-dim); 
      text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border);
    }
    .tool-item { padding: 10px 15px; font-size: 13px; color: var(--accent); border-bottom: 1px solid #111; }
    .agent-item { padding: 8px 15px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
    #taskTree { flex: 1; padding: 20px; overflow-y: auto; }
    .task-node { margin-left: 20px; border-left: 1px dashed var(--border); padding-left: 15px; margin-bottom: 10px; }
    .task-card { 
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px; 
      padding: 12px; cursor: pointer; transition: 0.2s;
    }
    .task-card:hover { border-color: var(--accent); }
    .task-card.active { border-left: 4px solid var(--accent); }
    .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .status-pending { background: #92400e; }
    .status-in_progress { background: #1e40af; animation: pulse 2s infinite; }
    .status-completed { background: #065f46; }
    #console { border-left: 1px solid var(--border); background: #000; display: flex; flex-direction: column; }
    #logStream { flex: 1; overflow-y: auto; padding: 15px; font-family: monospace; font-size: 12px; line-height: 1.6; }
    .log-entry { margin-bottom: 8px; border-bottom: 1px solid #111; }
    .log-thought { color: #a855f7; }
    #inputArea { height: 60px; border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 10px; }
    input { flex: 1; background: #111; border: 1px solid var(--border); color: white; padding: 0 15px; border-radius: 4px; outline: none; }
    button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .online { background: #22c55e; }
    .offline { background: #ef4444; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 20px;">
      <h1 style="color: var(--accent); font-size: 18px; margin: 0;">AGENT MESH V3.0</h1>
      <select id="meshSelect" style="background: #000; color: white; border: 1px solid var(--border); padding: 4px 8px;"></select>
    </div>
    <div style="font-size: 12px; color: var(--text-dim);">SSE: <span id="sseStatus">...</span></div>
  </header>
  <main>
    <aside>
      <div class="panel-title">MCP Tools</div>
      <div id="mcpTools"></div>
      <div class="panel-title" style="margin-top: 20px;">Active Experts</div>
      <div id="agentsList"></div>
    </aside>
    <section id="taskTree">
      <div class="panel-title">Recursive Task Tree</div>
      <div id="treeContainer"></div>
    </section>
    <section id="console">
      <div class="panel-title">Real-time Thought Stream</div>
      <div id="logStream"></div>
      <div id="inputArea">
        <input type="text" id="commandInput" placeholder="Command Mesh...">
        <button id="sendBtn">EXEC</button>
      </div>
    </section>
  </main>
  <script>
    const API = '/api/v1';
    const state = { meshId: localStorage.getItem('meshId') || '', tasks: [], selectedTaskId: null };
    const els = {
      meshSelect: document.getElementById('meshSelect'),
      treeContainer: document.getElementById('treeContainer'),
      logStream: document.getElementById('logStream'),
      agentsList: document.getElementById('agentsList'),
      mcpTools: document.getElementById('mcpTools'),
      commandInput: document.getElementById('commandInput'),
      sendBtn: document.getElementById('sendBtn'),
      sseStatus: document.getElementById('sseStatus')
    };
    async function req(path, method = 'GET', body = null) {
      const r = await fetch(API + path, {
        method, headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
      return r.json();
    }
    function buildTree(tasks, parentId = null) {
      const items = tasks.filter(t => (t.parentId || null) === parentId);
      return items.map(t => `
        <div class="task-node">
          <div class="task-card ${state.selectedTaskId === t.id ? 'active' : ''}" onclick="window.selectTask('${t.id}')">
            <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-dim);">
              <span>#${t.id.slice(0,8)}</span><span class="status-badge status-${t.status}">${t.status}</span>
            </div>
            <div style="font-weight:600; margin-top:5px;">${t.subject}</div>
          </div>
          ${buildTree(tasks, t.id)}
        </div>
      `).join('');
    }
    async function refresh() {
      if (!state.meshId) return;
      const [t, a, m] = await Promise.all([req('/tasks?meshId=' + state.meshId), req('/agents?meshId=' + state.meshId), req('/mcp/tools')]);
      els.treeContainer.innerHTML = buildTree(t.items || []);
      els.agentsList.innerHTML = (a.items || []).map(i => `<div class="agent-item"><div class="dot ${i.nodeOnline ? 'online' : 'offline'}"></div>${i.id}</div>`).join('');
      els.mcpTools.innerHTML = (m.tools || []).map(t => `<div class="tool-item">${t.name}</div>`).join('');
    }
    window.selectTask = (id) => { state.selectedTaskId = id; refresh(); };
    let sse = null;
    function connect() {
      if (sse) sse.close();
      if (!state.meshId) return;
      sse = new EventSource(API + '/events?meshId=' + state.meshId);
      sse.onopen = () => { els.sseStatus.textContent = 'ONLINE'; els.sseStatus.style.color = '#22c55e'; };
      sse.onerror = () => { els.sseStatus.textContent = 'OFFLINE'; };
      sse.addEventListener('message', (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'message.created') {
          const div = document.createElement('div');
          div.className = 'log-entry';
          div.innerHTML = `<span style="color:var(--accent)">[${ev.message.from}]</span> ${ev.message.payload.text || JSON.stringify(ev.message.payload)}`;
          els.logStream.appendChild(div);
          els.logStream.scrollTo({ top: els.logStream.scrollHeight, behavior: 'smooth' });
        }
        refresh();
      });
    }
    els.meshSelect.onchange = (e) => { state.meshId = e.target.value; localStorage.setItem('meshId', state.meshId); refresh(); connect(); };
    els.sendBtn.onclick = async () => {
      const text = els.commandInput.value.trim();
      if (!text) return;
      await req('/messages', 'POST', { id: 'web-' + Date.now(), meshId: state.meshId, from: 'user', to: '*', type: 'message', payload: { text } });
      els.commandInput.value = '';
    };
    req('/meshes').then(r => {
      els.meshSelect.innerHTML = r.items.map(m => `<option value="${m.id}">${m.id}</option>`).join('');
      if (r.items.length > 0 && !state.meshId) state.meshId = r.items[0].id;
      if (state.meshId) { els.meshSelect.value = state.meshId; refresh(); connect(); }
    });
  </script>
</body>
</html>
