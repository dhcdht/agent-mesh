# Agent Mesh 示例配置
# 复制为 mesh.yaml 并修改

mesh:
  id: my-mesh
  name: My Project Mesh

repos:
  - id: frontend-repo
    path: /repo/frontend
    agent:
      id: agent-frontend
      name: Frontend Agent
      cliType: opencode
      cliConfig:
        serverUrl: http://localhost:4096

  - id: backend-repo
    path: /repo/backend
    agent:
      id: agent-backend
      name: Backend Agent
      cliType: claude-code
      cliConfig:
        teamName: my-team

coordinator:
  url: ${MESH_COORDINATOR_URL:-http://localhost:3000}
  apiKey: ${MESH_API_KEY:-}

node:
  id: ${MESH_NODE_ID:-node-1}
  pollIntervalMs: 5000
