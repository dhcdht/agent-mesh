# Agent Mesh 自举配置：模拟真实开发团队
# 不同 Agent 负责不同模块，通过分布式协作推进项目

mesh:
  id: agent-mesh-dev
  name: Agent Mesh 核心团队

repos:
  - id: repo-coordinator
    path: /Users/dhcdht/Desktop/Projects/agent-mesh/packages/coordinator
    agent:
      id: agent-coordinator
      name: Coordinator 专家
      cliType: stdin
      cliConfig:
        command: claude
        args: ["-p"]
        timeoutMs: 300000

  - id: repo-node
    path: /Users/dhcdht/Desktop/Projects/agent-mesh/packages/node
    agent:
      id: agent-node
      name: Node 运行时专家
      cliType: stdin
      cliConfig:
        command: claude
        args: ["-p"]
        timeoutMs: 300000

  - id: repo-cli
    path: /Users/dhcdht/Desktop/Projects/agent-mesh/apps/cli
    agent:
      id: agent-cli
      name: CLI 体验专家
      cliType: stdin
      cliConfig:
        command: claude
        args: ["-p"]
        timeoutMs: 300000

  - id: repo-shared
    path: /Users/dhcdht/Desktop/Projects/agent-mesh/packages/shared
    agent:
      id: agent-shared
      name: 架构师 (Shared)
      cliType: stdin
      cliConfig:
        command: claude
        args: ["-p"]
        timeoutMs: 300000

coordinator:
  url: http://localhost:3000
  apiKey:

node:
  id: ${MESH_NODE_ID:-node-selfhost}
  pollIntervalMs: 3000
