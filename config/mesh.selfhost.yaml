mesh:
  id: agent-mesh-dev
  name: Agent Mesh 核心团队

repos:
  - id: repo-coordinator
    path: /Users/dhcdht/Desktop/Projects/agent-mesh/packages/coordinator
    agent:
      id: agent-coordinator
      name: Coordinator 专家
      cliType: stdin
      cliConfig:
        command: claude
        args: ["-p"]
        timeoutMs: 600000
        env:
          CLAUDE_CODE_FORCE_ACCEPT: "1"
          NON_INTERACTIVE: "true"
          CI: "true"

  - id: repo-node
    path: /Users/dhcdht/Desktop/Projects/agent-mesh/packages/node
    agent:
      id: agent-node
      name: Node 运行时专家
      cliType: noop
      cliConfig: {}

coordinator:
  url: http://localhost:3000
  apiKey:

node:
  id: node-selfhost
  pollIntervalMs: 3000
